<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracking App — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0d1117;
    --paper: #f5f0e8;
    --sage: #4a7c59;
    --sage-light: #7fad8e;
    --warm: #e8c547;
    --muted: #8a8070;
    --card: #fffdf8;
    --border: #e0d8cc;
    --error: #c0392b;
    --success: #2f7a4d;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; }

  .auth-card { width: 100%; max-width: 420px; }
  .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); text-decoration: none; font-size: 0.875rem; }
  .back-link:hover { color: var(--ink); }

  h2.form-title { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 0.4rem; }
  .form-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

  .field { margin-bottom: 1.2rem; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .field input {
    width: 100%; padding: 0.75rem 1rem;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--ink);
    background: var(--card); transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus { border-color: var(--sage); }

  .btn-primary {
    width: 100%; padding: 0.9rem;
    background: var(--sage); color: #fff;
    border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { background: #3d6b4a; }
  .btn-primary:active { transform: scale(0.99); }

  .error-msg { background: #fdf0ef; border: 1px solid #f5c6c3; color: var(--error); border-radius: 6px; padding: 0.6rem 0.9rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
  .error-msg.show { display: block; }
  .success-msg { background: #eef7f1; border: 1px solid #bfe0cb; color: var(--success); border-radius: 6px; padding: 0.6rem 0.9rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
  .success-msg.show { display: block; }

  .step { display: none; }
  .step.active { display: block; }
  .question-box { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 1.2rem; font-size: 0.95rem; color: var(--ink); }
</style>
</head>
<body>
<div class="auth-card">
  <a class="back-link" href="/login">&larr; Back to sign in</a>

  <!-- Step 1: identify account -->
  <div class="step active" id="step-1">
    <h2 class="form-title">Reset your password</h2>
    <p class="form-sub">Enter your username or email to find your security question</p>
    <div class="error-msg" id="step1-err"></div>
    <div class="field"><label>Email or Username</label><input type="text" id="fp-login" placeholder="you@email.com"></div>
    <button class="btn-primary" onclick="findQuestion()">Continue</button>
  </div>

  <!-- Step 2: answer + new password -->
  <div class="step" id="step-2">
    <h2 class="form-title">Answer your security question</h2>
    <p class="form-sub">Then choose a new password</p>
    <div class="error-msg" id="step2-err"></div>
    <div class="success-msg" id="step2-ok"></div>
    <div class="question-box" id="fp-question"></div>
    <div class="field"><label>Answer</label><input type="text" id="fp-answer" placeholder="Your answer"></div>
    <div class="field"><label>New Password</label><input type="password" id="fp-password" placeholder="At least 6 characters"></div>
    <button class="btn-primary" onclick="resetPassword()">Reset Password</button>
  </div>
</div>

<script>
let currentLogin = '';

async function findQuestion() {
  const login = document.getElementById('fp-login').value.trim();
  const err = document.getElementById('step1-err');
  if (!login) { showErr(err, 'Enter your username or email'); return; }
  const res = await fetch('/api/forgot-password/question', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({login})
  });
  const data = await res.json();
  if (data.ok) {
    currentLogin = login;
    document.getElementById('fp-question').textContent = data.question;
    document.getElementById('step-1').classList.remove('active');
    document.getElementById('step-2').classList.add('active');
  } else {
    showErr(err, data.error);
  }
}

async function resetPassword() {
  const answer = document.getElementById('fp-answer').value.trim();
  const password = document.getElementById('fp-password').value;
  const err = document.getElementById('step2-err');
  const ok = document.getElementById('step2-ok');
  if (!answer || !password) { showErr(err, 'Please fill in all fields'); return; }
  const res = await fetch('/api/forgot-password/reset', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({login: currentLogin, answer, password})
  });
  const data = await res.json();
  if (data.ok) {
    ok.textContent = 'Password reset. Redirecting to sign in...';
    ok.classList.add('show');
    setTimeout(() => { window.location = '/login'; }, 1500);
  } else {
    showErr(err, data.error);
  }
}

function showErr(el, msg) { el.textContent = msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 4000); }
</script>
</body>
</html>
